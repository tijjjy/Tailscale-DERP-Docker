name: Docker Build and Push
on:
  workflow_dispatch:
  schedule:
  - cron: "12 3 * * 5"

env:
  REGISTRY_URL: ${{ vars.REGISTRY_URL || 'ghcr.io' }}
  REPOSITORY_PATH: "${{ vars.REPOSITORY_PATH || '${{ github.repository }}' }}"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: "${{ env.REGISTRY_URL }}/${{ env.REPOSITORY_PATH }}:latest"
          load: true
          push: false

      - name: Extract version from container
        id: get-version
        run: |
          version_output=$(docker run --rm --entrypoint tailscale "${{ env.REGISTRY_URL }}/${{ env.REPOSITORY_PATH }}":latest version)
          version=$(echo "$version_output" | head -n1 | awk '{$1=$1};1')
          echo "DOCKER_TAG=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push image
        run: |
          full_image="${{ env.REGISTRY_URL }}/${{ env.REPOSITORY_PATH }}"

          docker tag "$full_image:latest" "$full_image:$DOCKER_TAG"

          docker push "$full_image:latest"
          docker push "$full_image:$DOCKER_TAG"
